[project]
name = "shutter-farm"
version = "0.1.0"
description = "Containerized batch runner for the shutter toolchain: idempotent scheduled culling over a media volume, with structured logs and Prometheus metrics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Keivan Malhani" }]
keywords = [
    "batch-processing",
    "kubernetes",
    "cloud-run",
    "docker",
    "observability",
    "photography",
    "local-first",
]
# Stdlib only, on purpose. This runs in a container beside heavy tools;
# it should never be the reason an image fails to build or a CVE scan
# lights up. It dispatches to the tools, it does not import them.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
shutter-farm = "shutter_farm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shutter_farm"]
